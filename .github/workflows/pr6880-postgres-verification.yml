name: "PR #6880 PostgreSQL Test Verification"

on:
  push:
    branches:
      - "verify/*"
      - "test/*"
      - "ci-verify-pr6880"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run talk API tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventyay
          POSTGRES_PASSWORD: eventyay
          POSTGRES_DB: eventyay-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eventyay -d eventyay-db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages (gettext + postgresql-client + redis-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext postgresql-client redis-tools

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (test group)
        run: uv sync --directory app --group test

      - name: Run six schedule authorization tests on PostgreSQL 16
        env:
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
          EVY_POSTGRES_USER: eventyay
          EVY_POSTGRES_PASSWORD: eventyay
          EVY_POSTGRES_DB: eventyay-db
          EVY_POSTGRES_HOST: localhost
          EVY_POSTGRES_PORT: "5432"
          EVY_REDIS_URL: redis://localhost:6379/0
          EVY_SECRET_KEY: ci-test-secret-key
          EVY_DEBUG: "true"
          EVY_RUNNING_ENVIRONMENT: testing
          GITHUB_WORKFLOW: "true"
        working-directory: app
        run: |
          uv run pytest \
            tests/talk/api/test_api_schedule.py::test_reviewer_who_can_see_speaker_names_cannot_access_wip_or_orga_fields \
            tests/talk/api/test_api_schedule.py::test_talk_slot_filter_fallback_and_direct_instantiation \
            tests/talk/api/test_api_schedule.py::test_list_slots_team_api_token_wip_access \
            tests/talk/api/test_api_schedule.py::test_talk_slot_filter_anonymous_cannot_enumerate_private_submissions \
            tests/talk/api/test_api_schedule.py::test_list_slots_orga_can_filter_by_schedule_version_wip \
            tests/talk/api/test_api_schedule.py::test_list_slots_anonymous_cannot_filter_by_schedule_version_wip \
            -v --tb=short

      - name: Verify regression failure when base.orga_view_schedule is restored
        env:
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
          EVY_POSTGRES_USER: eventyay
          EVY_POSTGRES_PASSWORD: eventyay
          EVY_POSTGRES_DB: eventyay-db
          EVY_POSTGRES_HOST: localhost
          EVY_POSTGRES_PORT: "5432"
          EVY_REDIS_URL: redis://localhost:6379/0
          EVY_SECRET_KEY: ci-test-secret-key
          EVY_DEBUG: "true"
          EVY_RUNNING_ENVIRONMENT: testing
          GITHUB_WORKFLOW: "true"
        working-directory: app
        run: |
          # 1. Verify original permission before modification
          grep -q "base\.release_schedule" eventyay/api/filters/schedule.py || {
            echo "ERROR: schedule.py does not contain expected base.release_schedule before mutation!"
            exit 1
          }
          if grep -q "base\.orga_view_schedule" eventyay/api/filters/schedule.py; then
            echo "ERROR: schedule.py already contains base.orga_view_schedule before mutation!"
            exit 1
          fi

          cp eventyay/api/filters/schedule.py eventyay/api/filters/schedule.py.bak
          restore_file() {
            cp -f eventyay/api/filters/schedule.py.bak eventyay/api/filters/schedule.py 2>/dev/null || true
            rm -f eventyay/api/filters/schedule.py.bak 2>/dev/null || true
          }
          trap restore_file EXIT

          # 2. Swap permission to vulnerable base.orga_view_schedule
          sed -i "s/base\.release_schedule/base.orga_view_schedule/g" eventyay/api/filters/schedule.py
          grep -q "base.orga_view_schedule" eventyay/api/filters/schedule.py || {
            echo "ERROR: Failed to swap permission to base.orga_view_schedule"
            exit 1
          }

          # 3. Run negative test and record structured JUnit XML
          set +e
          uv run pytest tests/talk/api/test_api_schedule.py::test_reviewer_who_can_see_speaker_names_cannot_access_wip_or_orga_fields \
            --junitxml=/tmp/negative_test.xml \
            -v --tb=short
          test_exit=$?
          set -e

          if [ "$test_exit" -ne 1 ]; then
            echo "ERROR: Expected pytest exit code 1, got $test_exit"
            exit 1
          fi

          # 4. Parse JUnit XML to verify exact test failure reason
          python -c '
          import xml.etree.ElementTree as ET, sys

          try:
              tree = ET.parse("/tmp/negative_test.xml")
          except Exception as e:
              print(f"ERROR: Failed to parse JUnit XML report: {e}")
              sys.exit(1)

          root = tree.getroot()
          if root.tag == "testsuites":
              testsuites = root.findall("testsuite")
          elif root.tag == "testsuite":
              testsuites = [root]
          else:
              print(f"ERROR: Unexpected root element <{root.tag}> in JUnit XML.")
              sys.exit(1)

          total_errors = sum(int(ts.attrib.get("errors", 0)) for ts in testsuites)
          total_failures = sum(int(ts.attrib.get("failures", 0)) for ts in testsuites)
          total_skipped = sum(int(ts.attrib.get("skipped", 0)) for ts in testsuites)

          if total_errors > 0:
              print(f"ERROR: Pytest encountered {total_errors} infrastructure/setup error(s).")
              sys.exit(1)

          if total_skipped > 0:
              print(f"ERROR: Pytest recorded {total_skipped} skipped test(s).")
              sys.exit(1)

          if total_failures != 1:
              print(f"ERROR: Expected exactly 1 test failure, but found {total_failures}.")
              sys.exit(1)

          target_name = "test_reviewer_who_can_see_speaker_names_cannot_access_wip_or_orga_fields"
          testcases = [tc for ts in testsuites for tc in ts.findall("testcase")]
          target_case = next((tc for tc in testcases if tc.attrib.get("name") == target_name), None)

          if target_case is None:
              print(f"ERROR: Target testcase {target_name} not found in test report.")
              sys.exit(1)

          failure = target_case.find("failure")
          if failure is None:
              print("ERROR: Target testcase did not fail.")
              sys.exit(1)

          failure_msg = (failure.attrib.get("message", "") or "") + " " + (failure.text or "")

          if "content_rev_wip" not in failure_msg:
              print("ERROR: Unexpected failure reason.")
              sys.exit(1)

          print("SUCCESS: Negative verification confirmed. Test failed specifically at reviewer WIP schedule access check.")
          '

          # 5. Restore file and verify clean state
          restore_file
          trap - EXIT
          git diff --exit-code eventyay/api/filters/schedule.py
