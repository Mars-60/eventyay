name: "PR #6880 PostgreSQL Test Verification"

on:
  push:
    branches:
      - "verify/*"
      - "test/*"
      - "ci-verify-pr6880"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run talk API tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventyay
          POSTGRES_PASSWORD: eventyay
          POSTGRES_DB: eventyay-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eventyay -d eventyay-db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages (gettext + postgresql-client + redis-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext postgresql-client redis-tools

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (test group)
        run: uv sync --directory app --group test

      - name: Run seven PR-specific tests on PostgreSQL 16
        env:
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
          EVY_POSTGRES_USER: eventyay
          EVY_POSTGRES_PASSWORD: eventyay
          EVY_POSTGRES_DB: eventyay-db
          EVY_POSTGRES_HOST: localhost
          EVY_POSTGRES_PORT: "5432"
          EVY_REDIS_URL: redis://localhost:6379/0
          EVY_SECRET_KEY: ci-test-secret-key
          EVY_DEBUG: "true"
          EVY_RUNNING_ENVIRONMENT: testing
          GITHUB_WORKFLOW: "true"
        working-directory: app
        run: |
          uv run pytest tests/talk/api/test_api_schedule.py tests/talk/api/test_api_reviews.py -k "test_talk_slot_filter_fallback_and_direct_instantiation or test_list_slots_team_api_token_wip_access or test_talk_slot_filter_anonymous_cannot_enumerate_private_submissions or test_reviewer_can_filter_by_submission or test_reviewer_cannot_enumerate_inaccessible_submission_or_speaker or test_organizer_can_filter_reviews_by_submission_and_speaker or test_review_filter_direct_instantiation" -v --tb=short

      - name: Run full test command on PR branch
        env:
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
          EVY_POSTGRES_USER: eventyay
          EVY_POSTGRES_PASSWORD: eventyay
          EVY_POSTGRES_DB: eventyay-db
          EVY_POSTGRES_HOST: localhost
          EVY_POSTGRES_PORT: "5432"
          EVY_REDIS_URL: redis://localhost:6379/0
          EVY_SECRET_KEY: ci-test-secret-key
          EVY_DEBUG: "true"
          EVY_RUNNING_ENVIRONMENT: testing
          GITHUB_WORKFLOW: "true"
        working-directory: app
        run: |
          set +e
          uv run pytest tests/talk/api/test_api_schedule.py tests/talk/api/test_api_reviews.py -v --tb=line > /tmp/pr_test_output.txt 2>&1
          grep "^FAILED " /tmp/pr_test_output.txt | sort -u > /tmp/pr_failures.txt
          echo "PR branch failure count: $(wc -l < /tmp/pr_failures.txt)"
          set -e

      - name: Run full test command on unmodified upstream/dev
        env:
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
          EVY_POSTGRES_USER: eventyay
          EVY_POSTGRES_PASSWORD: eventyay
          EVY_POSTGRES_DB: eventyay-db
          EVY_POSTGRES_HOST: localhost
          EVY_POSTGRES_PORT: "5432"
          EVY_REDIS_URL: redis://localhost:6379/0
          EVY_SECRET_KEY: ci-test-secret-key
          EVY_DEBUG: "true"
          EVY_RUNNING_ENVIRONMENT: testing
          GITHUB_WORKFLOW: "true"
        working-directory: app
        run: |
          set +e
          git remote add upstream https://github.com/fossasia/eventyay.git || true
          git fetch upstream dev
          git checkout upstream/dev -- app/
          uv run pytest tests/talk/api/test_api_schedule.py tests/talk/api/test_api_reviews.py -v --tb=line > /tmp/upstream_test_output.txt 2>&1
          grep "^FAILED " /tmp/upstream_test_output.txt | sort -u > /tmp/upstream_failures.txt
          echo "upstream/dev failure count: $(wc -l < /tmp/upstream_failures.txt)"
          set -e

      - name: Compare failure IDs between upstream/dev and PR branch
        run: |
          echo "=========================================================="
          echo "=== FAILURES PRESENT IN PR BUT NOT UPSTREAM (REGRESSIONS) ==="
          echo "=========================================================="
          comm -23 /tmp/pr_failures.txt /tmp/upstream_failures.txt > /tmp/regressions.txt
          cat /tmp/regressions.txt
          echo ""
          echo "=========================================================="
          echo "=== FAILURES PRESENT IN UPSTREAM BUT FIXED BY PR ==="
          echo "=========================================================="
          comm -13 /tmp/pr_failures.txt /tmp/upstream_failures.txt
          echo ""
          echo "=========================================================="
          echo "=== COMMON FAILURES ON BOTH (EXISTING UPSTREAM BASELINE) ==="
          echo "=========================================================="
          comm -12 /tmp/pr_failures.txt /tmp/upstream_failures.txt
          echo ""
          if [ -s /tmp/regressions.txt ]; then
            echo "ERROR: Regressions detected!"
            exit 1
          else
            echo "SUCCESS: Zero regressions introduced by PR."
          fi
